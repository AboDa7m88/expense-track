<div class="container py-5 fade-in-page" style="max-width: 500px;">
  <h1 class="mb-4">Expense Tracker</h1>

  <div class="row g-2 mb-4">
    <div class="col-12">
      <input type="text" class="form-control" placeholder="Expense name" [(ngModel)]="name" />
    </div>
    <div class="col-6">
      <input type="number" class="form-control" placeholder="Amount" [(ngModel)]="amount" />
    </div>
    <div class="col-6">
      <input type="text" class="form-control" placeholder="Category" [(ngModel)]="category" />
    </div>
    <div class="col-12">
      <button class="btn btn-primary w-100" (click)="addExpense()">Add Expense</button>
    </div>
  </div>

  @if (expenses.length === 0) {
    <p class="text-muted">No expenses yet.</p>
  } @else {
    <ul class="list-group mb-3">
      @for (expense of expenses; track expense) {
        <li
          class="list-group-item d-flex justify-content-between align-items-center expense-item"
          [class.removing]="isRemoving(expense)"
        >
          <div>
            <strong>{{ expense.name }}</strong>
            <span class="badge bg-secondary ms-2">{{ expense.category }}</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span>${{ expense.amount }}</span>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteExpense(expense)">×</button>
          </div>
        </li>
      }
    </ul>

    <h5 class="text-end">Total: ${{ total }}</h5>
  }
</div>
